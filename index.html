<!doctype html>
<html lang="en">
	<head>
		<title>Hyper Run</title>
		<link rel="icon" href="about:blank" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div id="staminaBar" class="hidden">
			<div id="staminaBarFill"></div>
			<div id="staminaBarLabel">Stamina</div>
		</div>

		<div id="mainMenuOverlay">
			<div class="menu-panel">
				<h1>HYPER RUN</h1>
				<div class="button-container">
					<button id="startGameButton">Start Game</button>
				</div>
			</div>
		</div>

		<div id="gameOverOverlay">
			<div class="game-over-panel">
				<h1>GAME OVER</h1>
				<div class="game-over-stats">
					<div class="stat-item">
						<span class="stat-label">Final Score:</span>
						<span class="stat-value" id="finalScore">0</span>
					</div>
					<div class="stat-item">
						<span class="stat-label">Survival Time:</span>
						<span class="stat-value"><span id="survivalTime">0</span>s</span>
					</div>
				</div>
				<div class="button-container">
					<button id="restartButton">Restart Game</button>
					<button id="menuButton">Main Menu</button>
				</div>
			</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "./node_modules/three/build/three.module.js"
				}
			}
		</script>

		<script type="module">
			import {
				restartGame,
				startGame,
				returnToMenu,
			} from './src/gameManager.js';

			document
				.getElementById('startGameButton')
				.addEventListener('click', () => {
					startGame();
				});

			document.getElementById('restartButton').addEventListener('click', () => {
				restartGame();
			});

			document.getElementById('menuButton').addEventListener('click', () => {
				returnToMenu();
			});
		</script>

		<script type="module" src="./src/main.js"></script>
	</body>
</html>
