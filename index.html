<!doctype html>
<html lang="en">
	<head>
		<title>ThreeJS Debug</title>
		<link rel="icon" href="about:blank" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				margin: 0;
				overflow: hidden;
				font-family: Arial, sans-serif;
			}

			canvas {
				display: block;
			}

			/* Game Over Overlay */
			#gameOverOverlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0.85);
				display: flex;
				justify-content: center;
				align-items: center;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.3s ease-in-out;
				z-index: 1000;
			}

			#gameOverOverlay.active {
				opacity: 1;
				pointer-events: auto;
			}

			.game-over-panel {
				background: linear-gradient(135deg, #1f1f1f 0%, #0f0f0f 100%);
				border: 3px solid #aa2020;
				border-radius: 15px;
				padding: 50px;
				text-align: center;
				color: white;
				box-shadow:
					0 0 30px rgba(170, 32, 32, 0.4),
					inset 0 0 20px rgba(170, 32, 32, 0.05);
				max-width: 500px;
				animation: slideIn 0.5s ease-out;
			}

			@keyframes slideIn {
				from {
					transform: scale(0.8) translateY(-50px);
					opacity: 0;
				}
				to {
					transform: scale(1) translateY(0);
					opacity: 1;
				}
			}

			.game-over-panel h1 {
				font-size: 3.5em;
				margin-bottom: 30px;
				color: #dd6666;
				text-shadow:
					0 0 10px rgba(221, 102, 102, 0.5),
					0 0 20px rgba(170, 32, 32, 0.3);
				letter-spacing: 2px;
			}

			.game-over-stats {
				margin: 40px 0;
				display: flex;
				flex-direction: column;
				gap: 25px;
			}

			.stat-item {
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-size: 1.5em;
				padding: 15px 20px;
				background-color: rgba(170, 32, 32, 0.08);
				border-radius: 8px;
				border-left: 4px solid #aa2020;
			}

			.stat-label {
				font-weight: bold;
				color: #999999;
				letter-spacing: 1px;
			}

			.stat-value {
				font-size: 2em;
				font-weight: bold;
				color: #dd6666;
				text-shadow: 0 0 5px rgba(221, 102, 102, 0.3);
			}

			.button-container {
				margin-top: 40px;
				display: flex;
				gap: 20px;
				justify-content: center;
				flex-wrap: wrap;
			}

			button {
				padding: 15px 40px;
				font-size: 1.2em;
				font-weight: bold;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				transition: all 0.3s ease;
				text-transform: uppercase;
				letter-spacing: 1px;
			}

			#restartButton {
				background: linear-gradient(135deg, #aa2020 0%, #881010 100%);
				color: white;
				box-shadow: 0 0 15px rgba(170, 32, 32, 0.4);
			}

			#restartButton:hover {
				transform: scale(1.05);
				box-shadow: 0 0 25px rgba(170, 32, 32, 0.6);
			}

			#restartButton:active {
				transform: scale(0.95);
			}

			#menuButton {
				background: linear-gradient(135deg, #333333 0%, #1a1a1a 100%);
				color: #cccccc;
				box-shadow: 0 0 15px rgba(170, 32, 32, 0.3);
			}

			#menuButton:hover {
				transform: scale(1.05);
				box-shadow: 0 0 25px rgba(170, 32, 32, 0.5);
			}

			#menuButton:active {
				transform: scale(0.95);
			}
		</style>
	</head>
	<body>
		<!-- Game Over Overlay -->
		<div id="gameOverOverlay">
			<div class="game-over-panel">
				<h1>GAME OVER</h1>
				<div class="game-over-stats">
					<div class="stat-item">
						<span class="stat-label">Final Score:</span>
						<span class="stat-value" id="finalScore">0</span>
					</div>
					<div class="stat-item">
						<span class="stat-label">Survival Time:</span>
						<span class="stat-value"><span id="survivalTime">0</span>s</span>
					</div>
				</div>
				<div class="button-container">
					<button id="restartButton">Restart Game</button>
					<button id="menuButton">Main Menu</button>
				</div>
			</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "./node_modules/three/build/three.module.js"
				}
			}
		</script>

		<script type="module">
			import { restartGame } from './src/gameManager.js';

			// Restart button handler
			document.getElementById('restartButton').addEventListener('click', () => {
				restartGame();
			});

			// Menu button handler (placeholder - implement menu later)
			document.getElementById('menuButton').addEventListener('click', () => {
				console.log('Menu button clicked');
				// TODO: Implement menu navigation
			});
		</script>

		<script type="module" src="./src/main.js"></script>
	</body>
</html>
